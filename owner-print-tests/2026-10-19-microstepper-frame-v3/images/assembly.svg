<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b15a20" stroke-width="1.5"/></marker></defs>
<rect width="1060" height="640" fill="#f8fafb"/>
<g font-family="sans-serif" fill="#223747"><text x="35" y="38" font-size="24" font-weight="bold">E-302 v3 — montage en krachtpad</text><text x="35" y="64" font-size="15">Schematische doorsnede; maten in mm vanaf onderzijde frame. Eén helft weggelaten.</text></g>
<!-- assembly side section, scale 8px/mm, baseline 540 -->
<g fill="#aac1cf" stroke="#55778b" stroke-width="1.5">
<rect x="100" y="524" width="256" height="16"/><rect x="124" y="220" width="24" height="304"/><rect x="308" y="220" width="24" height="304"/>
<path d="M148 456H195V524H148Z M261 456H308V524H261Z"/>
<path d="M148 444.4H212V456H148Z M244 444.4H308V456H244Z"/>
<path d="M148 346.4H198.4V376H148Z M257.6 346.4H308V376H257.6Z"/>
<path d="M148 328H211.2V344H148Z M244.8 328H308V344H244.8Z"/>
<path d="M188 220H208.8V284H188Z M247.2 220H268V284H247.2Z"/>
</g>
<!-- motor -->
<rect x="196" y="458.4" width="64" height="65.6" rx="4" fill="#ddd" stroke="#777"/>
<rect x="178" y="475" width="14" height="35" fill="#578c71"/>
<path d="M178 480H158M178 488H158M178 496H158M178 504H158" stroke="#815f52" stroke-width="2"/>
