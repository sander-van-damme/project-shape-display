<rect x="219.2" y="426.4" width="17.6" height="17" fill="#c9a54e" stroke="#8e702d"/>
<path d="M228 443V458" stroke="#888" stroke-width="6"/>
<!-- ring -->
<path d="M200 442.4H215.2V446.4H200Z M240.8 442.4H256V446.4H240.8Z" fill="#777"/>
<!-- rotor with cavity -->
<path d="M200 346.4H256V442.4H239.6V438.4H238V394.4H218V438.4H216.4V442.4H200Z" fill="#e9ad57" stroke="#ac742b" stroke-width="1.4"/>
<rect x="222.4" y="218.4" width="11.2" height="128" fill="#e9ad57"/>
<path d="M215.2 226L240.8 234M215.2 250L240.8 258M215.2 274L240.8 282M215.2 298L240.8 306M215.2 322L240.8 330" stroke="#ac742b" stroke-width="4"/>
<!-- hollow pin transparent outline -->
<rect x="210.4" y="166.4" width="35.2" height="144" fill="#77b89d" fill-opacity=".25" stroke="#377b61" stroke-width="2"/>
<path d="M180 308.5H276V310.4H180Z" fill="#77b89d"/>
<!-- labels -->
<g font-family="sans-serif" font-size="15" fill="#223747" stroke="none">
<text x="380" y="176">18-mm pin; bestaande dunne printvoet laten zitten</text>
<text x="380" y="204">Pinbovenkant 5,2–8,2 boven frame = 3 mm proefslag</text>
<text x="380" y="248">Ongewijzigde draad: Ø3,2 / spoed 3 / lengte 16</text>
<text x="380" y="335">Bovenste aanslag: Z24,5; rotor bovenvlak Z24,2</text>
<text x="380" y="365">Ronde geleiding Ø7,4 rond rotor Ø7</text>
<text x="380" y="400">Holtedak Z18,2; rechte C-ribben Z12,7–18,2</text>
<text x="380" y="436">Rotor rust op M3-ring ID3,2 / OD7 / dikte0,50</text>
<text x="380" y="460">Ring in Ø7,3-zitting; draagvlak Z11,7</text>
<text x="380" y="492">Motor Ø8 × 8,2; huis op Z2, PCB naar open −X-zijde</text>
<text x="380" y="520">Tandlengte / boss / PCB werkelijk controleren: onbekend</text>
</g>
<g stroke="#718997" stroke-width="1" fill="none"><path d="M246 175H365M241 249H365M250 336H365M258 360H365M238 397H365M256 444H365M260 490H365"/></g>
<path d="M280 350V435H290V474H315V520" stroke="#b15a20" fill="none" stroke-width="3" marker-end="url(#arrow)"/>
<g font-family="sans-serif" fill="#223747"><text x="35" y="580" font-size="17" font-weight="bold">Last: pin → schroef/rotor → sluitring → frame → voet</text><text x="35" y="605" font-size="15">Motoras geeft alleen koppel. Stop bij asverplaatsing, klemmen, slip of druk op PCB/draden.</text></g>
</svg>
