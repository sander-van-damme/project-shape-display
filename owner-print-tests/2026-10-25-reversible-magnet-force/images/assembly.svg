<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#34495e"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#1c2c3c}.title{font-size:24px;font-weight:bold}.sub{font-size:15px}.label{font-size:16px}.small{font-size:13px}</style>
<text x="28" y="35" class="title">E-305 · one reusable force fixture</text>
<text x="28" y="65" class="sub">Two mechanically independent supports: scale carries magnet; bench carries coil.</text>
<rect x="70" y="600" width="350" height="60" fill="#dbeaf5" stroke="#34495e"/>
<text x="95" y="638" class="label">0.01-g scale + ≥100-g nonmagnetic preload</text>
<rect x="290" y="570" width="60" height="25" fill="#7fb3d5" stroke="#34495e"/>
<rect x="310" y="210" width="18" height="360" fill="#ddc49d" stroke="#34495e"/>
<text x="340" y="390" class="small">Ø6 wood dowel</text>
<text x="340" y="412" class="small">nominal 80 mm</text>
<rect x="100" y="180" width="230" height="25" fill="#7fb3d5" stroke="#34495e"/>
<rect x="105" y="205" width="20" height="30" fill="#7fb3d5" stroke="#34495e"/>
<rect x="105" y="235" width="20" height="15" fill="#e88484" stroke="#34495e"/>
<rect x="105" y="250" width="20" height="15" fill="#6d9dd6" stroke="#34495e"/>
<text x="78" y="238" class="small">N</text>
<rect x="77" y="248" width="18" height="50" fill="#d99b52" stroke="#34495e"/>
<rect x="135" y="248" width="18" height="50" fill="#d99b52" stroke="#34495e"/>
<rect x="68" y="298" width="110" height="10" fill="#b8bec3" stroke="#34495e"/>
<rect x="68" y="241" width="110" height="7" fill="#b8bec3" stroke="#34495e"/>
<path d="M115 215L115 335" fill="none" stroke="#34495e" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="55" y="308" width="245" height="12" fill="#c6c9cd" stroke="#34495e"/>
<rect x="340" y="308" width="265" height="12" fill="#c6c9cd" stroke="#34495e"/>
<path d="M300 314L340 314" fill="none" stroke="#34495e" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="580" y="320" width="25" height="330" fill="#c6c9cd" stroke="#34495e"/>
<text x="450" y="350" class="small">Independent bench stand</text>
<path d="M100 265L45 265" fill="none" stroke="#34495e" stroke-width="1.4"/>
<text x="28" y="286" class="small">g</text>
<text x="28" y="350" class="small">z=0 at copper top</text>
<path d="M55 335L77 248" fill="none" stroke="#34495e" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M147 268L490 140" fill="none" stroke="#34495e" stroke-width="1.4"/>
<text x="495" y="138" class="label">140 turns, 7 layers ×20 turns</text>
<text x="495" y="162" class="small">0.15-mm enamelled copper / 0.18-mm pitch</text>
<text x="495" y="184" class="small">Winding ID4.8 / OD7.32 / length3.6 mm</text>
<text x="640" y="270" class="label">1. Print six parts as laid out.</text>
<text x="640" y="300" class="label">2. Wind, glue flange, measure R.</text>
<text x="640" y="330" class="label">3. Invert magnet arm for assembly.</text>
<text x="640" y="360" class="label">4. Bond magnet to Ø3 post; tape.</text>
<text x="640" y="390" class="label">5. Set signed g using a caliper.</text>
<text x="640" y="420" class="label">6. Read force at measured ±I.</text>
<text x="640" y="465" class="small">Optional core: Ø3 ×8 steel,</text>
<text x="640" y="486" class="small">sleeve from below; tip flush z=0.</text>
<text x="640" y="507" class="small">Only use g ≥0.3 mm with core.</text>
<text x="28" y="700" class="label">Fz = −(scale reading − baseline) ×9.80665 mN/g. Tare at every gap; retain raw readings.</text>
<text x="28" y="731" class="sub">No contact between magnet/post and bore. Move stand, never preload the coil through the scale.</text>
<text x="28" y="758" class="sub">Bracket points 90° to magnet arm: projected crossing above is clear in depth. No dowel/stand contact.</text>
<text x="640" y="560" class="small">Top view: keep supports separate</text>
<rect x="770" y="585" width="110" height="12" fill="#7fb3d5" stroke="#34495e"/>
<rect x="770" y="585" width="12" height="70" fill="#c6c9cd" stroke="#34495e"/>
<text x="890" y="598" class="small">dowel</text>
<text x="790" y="650" class="small">bench arm</text>
<text x="640" y="605" class="small">magnet/coil →</text>
</svg>
