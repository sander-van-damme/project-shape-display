<text x="470" y="452" class="label"> 1     0          +I</text>
<text x="470" y="478" class="label"> 0     1          −I</text>
<text x="28" y="535" class="label">Bridge paths handle inductive recirculation. No single flyback diode across a reversible coil.</text>
<text x="28" y="565" class="small">Higher-current stage: documented carrier sense-trace modification +0.43 Ω /1% /1206 AISEN resistor.</text>
<text x="28" y="590" class="small">Nominal trip ≈0.465 A, verify on load before removing10 Ω. Keep bench limit0.50 A; no default current limit.</text>
<text x="28" y="620" class="small">Start ≤0.2-s pulses, ≥4.8-s cooling; stop at45°C or+10°C. Turn power off before changing core/wiring.</text>
<text x="28" y="651" class="small">Unused B inputs low. Supply/interlock must also stop shared rotary drive in any later clutch test.</text>
