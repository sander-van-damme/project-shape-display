<text x="74" y="641" font-size="15">x → ; y ↓ langs rail. Alle geometrie in mm; tekening circa 4 px/mm.</text>
<text x="74" y="668" font-size="15">Oranje = losse motorplaat/riem; blauw = vast raster en voeten.</text>
<text x="74" y="693" font-size="15">Grijs = bank/rail; paars = twee versprongen handjacks.</text>
<path d="M580 112H1155V713H580Z" fill="#f2f6f8"/>
<text x="605" y="145" font-size="24">Eén geïntegreerde proef</text>
<text x="605" y="180" font-size="18">2×2 pinnen op 5,08; buitenmaat 4,50.</text>
<text x="605" y="210" font-size="18">Twee bankuitgangen bedienen één rij tegelijk.</text>
<text x="605" y="240" font-size="18">Bank schuift 5,08 naar de tweede rij.</text>
<text x="605" y="290" font-size="24">Montage in lagen</text>
<text x="605" y="325" font-size="17">1. Zet voeten en railblokken op 45-mm verhogingen.</text>
<text x="605" y="355" font-size="17">2. Monteer bank en los bedienbare riemrotoren.</text>
<text x="605" y="385" font-size="17">3. Schroef de vlak geprinte motorplaat op de bank.</text>
<text x="605" y="415" font-size="17">4. Motor onder plaat met 2-mm metalen spacers.</text>
<text x="605" y="445" font-size="17">5. Vast raster: onderstrips, schroeven, keeper.</text>
<text x="605" y="475" font-size="17">6. Korte guides op z50 en66; pinnen op z40,2.</text>
<text x="605" y="505" font-size="17">7. Jacks op (0,18) en (5,08,25); veerkracht meten.</text>
<text x="605" y="555" font-size="24">Verplaatsen</text>
<text x="605" y="590" font-size="17">Motor uit → beide 2,4 mm park → vrije tips zien</text>
<text x="605" y="620" font-size="17">→ indexpin uit → 5,08 schuiven → pin terug.</text>
<text x="605" y="665" font-size="17">Exacte maten/onderdelen: assembly.md.</text>
</svg>
