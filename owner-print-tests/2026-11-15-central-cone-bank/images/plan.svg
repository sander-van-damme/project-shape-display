<text x="38" y="40" font-size="28">DES-010 — bovenaanzicht en montagevolgorde</text>
<text x="38" y="70" font-size="17">Projectie van verschillende hoogten: overlap op papier betekent geen botsing. Geen fysiek werkingsbewijs.</text>
