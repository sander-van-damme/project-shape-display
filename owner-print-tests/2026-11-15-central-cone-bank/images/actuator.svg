<path d="M800,560 H920 V620 H800" class="wire"/><rect x="908" y="578" width="24" height="24" fill="white" stroke="#263544" stroke-width="2"/><text x="939" y="577" class="small">K boven</text><text x="939" y="600" class="small">A onder</text><text x="939" y="622" class="small">Flybackdiode</text>
<rect x="762" y="637" width="77" height="47" rx="4" fill="white" stroke="#263544" stroke-width="2"/><text x="767" y="658" class="small">N-MOSFET</text><text x="779" y="677" class="small">3,3 V</text>
<path d="M590,660 H660 M690,660 H762 M733,660 V707 M733,734 V755" class="wire"/>
<rect x="660" y="650" width="30" height="20" fill="white" stroke="#263544" stroke-width="2"/><text x="657" y="642" class="small">100 Ω</text><text x="590" y="687" class="small">GPIO ON</text>
<rect x="723" y="707" width="20" height="27" fill="white" stroke="#263544" stroke-width="2"/><text x="609" y="726" class="small">100 kΩ</text>
<text x="34" y="820">Eén spoel tegelijk; beide GPIO’s LOW bij opstart. Max. 200 ms puls, aanvankelijk minstens 5 s pauze.</text>
<text x="34" y="845">Meet stroom en schakelbelasting. Stop bij 45 °C, +10 °C, klemmen of schade. Geen spoelvoeding via GPIO/USB.</text>
</svg>
