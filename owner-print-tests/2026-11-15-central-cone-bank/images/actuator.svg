<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860">
<defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#17212d;font-size:16px}.title{font-size:25px;font-weight:bold}.sub{font-size:19px;font-weight:bold}.small{font-size:14px}.wire{fill:none;stroke:#263544;stroke-width:2.5}.dim{fill:none;stroke:#4775a0;stroke-width:1.5}.box{fill:#f2f5f8;stroke:#ccd5df;stroke-width:1.5}</style><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#4775a0"/></marker></defs>
<rect width="1180" height="860" fill="white"/>
<text x="32" y="40" class="title">Actuatorcoupon: schakelenergie en retentie afzonderlijk testen</text>
<text x="32" y="68">Bouwbaar krachtsproefstuk; elektrisch schakelen onder belasting is nog onbewezen.</text>
<rect x="25" y="88" width="1130" height="322" rx="10" class="box"/>
<text x="45" y="119" class="sub">Mechanisme — zijaanzicht als principeschema (niet op schaal)</text>
<path d="M75,304 H1100 V324 H75Z" fill="#9caebd"/>
<path d="M420,286 H730 V258 H650 L550,208 H420Z" fill="#e9ac55" stroke="#8c5d25" stroke-width="2"/>
<path d="M435,206 H550 M650,256 H720" stroke="#9b620d" stroke-width="5"/>
<text x="438" y="197" class="small">ON-dwell</text><text x="647" y="246" class="small">OFF-dwell</text>
<rect x="560" y="158" width="26" height="74" fill="#76a6c4" stroke="#305c76" stroke-width="2"/>
<path d="M573,128 V153 M560,137 H586 M573,143 L568,148 L578,155 L568,162 L578,169 L573,176" class="wire"/>
<text x="593" y="147">Ø2 contactpen / gemeten belasting 0,3–1 N</text>
<text x="768" y="193">Vlakke dwells voeren</text><text x="768" y="216">de reactiekracht af</text><text x="768" y="239">naar slider en vloer.</text>
<rect x="105" y="237" width="150" height="50" rx="8" fill="#cd875e" stroke="#845236" stroke-width="2"/>
<rect x="905" y="237" width="150" height="50" rx="8" fill="#cd875e" stroke="#845236" stroke-width="2"/>
<path d="M180,262 H455 M695,262 H980" stroke="#59616b" stroke-width="12"/>
<path d="M150,241 V282 M170,241 V282 M190,241 V282 M210,241 V282 M930,241 V282 M950,241 V282 M970,241 V282 M990,241 V282" stroke="#663b22" stroke-width="3"/>
<text x="111" y="224">Spoel links: OFF</text><text x="910" y="224">Spoel rechts: ON</text>
<path d="M425,346 H725" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="492" y="371">Slider: 10 mm</text>
<path d="M747,208 V258" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="760" y="283" class="small">Lift: 3 mm; helling: 6 mm</text>
<text x="45" y="397" class="small">Twee Ø3 × 24 mm stalen plungers. Lichte detent van Ø0,35 mm verenstaal; geen geprinte klikveer.</text>
<rect x="25" y="428" width="1130" height="365" rx="10" class="box"/>
<text x="45" y="460" class="sub">Laagspanningsschema — twee afzonderlijke aantrekkanalen</text>
<path d="M65,509 H1085" class="wire"/><text x="45" y="493">+5 V, benchvoeding begrensd op 0,5 A; zekering en hoofdschakelaar in toevoer</text>
<path d="M60,755 H1090" class="wire"/><text x="921" y="780" class="small">Gemeenschappelijke GND</text>
<!-- channel L -->
<path d="M280,509 V523 M280,550 V565 M280,615 V637 M280,684 V755" class="wire"/>
<rect x="267" y="523" width="26" height="27" fill="white" stroke="#263544" stroke-width="2"/><text x="307" y="541" class="small">10 Ω / 5 W (start)</text>
