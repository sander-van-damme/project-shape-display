<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" role="img" aria-label="Dimensioned friction screen assembly and torque measurement"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#16324c"/></marker><style>text{font-family:Arial,sans-serif;fill:#16324c;font-size:17px}.title{font-size:25px;font-weight:bold}.small{font-size:14px}.part{fill:#d7ebec;stroke:#247e83;stroke-width:2}.steel{fill:#aab7c3;stroke:#485b70;stroke-width:2}.line{stroke:#16324c;stroke-width:1.5;fill:none}.dim{stroke:#16324c;stroke-width:1.2;marker-end:url(#a);marker-start:url(#a);fill:none}.force{stroke:#b84b34;stroke-width:3;marker-end:url(#a);fill:none}</style></defs>
<rect width="1100" height="740" fill="#fff"/><text x="25" y="38" class="title">E-303 · gravity-loaded friction screen</text><text x="25" y="65">Principle fixture; Ø4.7 contact is pitch-sized, the complete fixture is not.</text>
<text x="25" y="105" class="title">Exploded section · not to scale</text>
<path d="M180 133 V530" class="line" stroke-dasharray="5 5"/><rect x="174" y="145" width="12" height="360" class="steel"/><text x="210" y="160">Fixed smooth steel guide Ø2 × 30 mm</text><text x="210" y="182" class="small">Tape/glue into base; deburr ends, measure diameter.</text>
<rect x="134" y="203" width="92" height="33" fill="#f4ca7d" stroke="#a9771c"/><path d="M155 188 V214 M205 188 V214" class="force"/><text x="260" y="222">Weighed nuts/washers, centred around guide</text>
<path d="M80 270 H140 V245 H150 V270 H210 V245 H220 V270 H280 V282 H80 Z" class="part"/><text x="310" y="266">Follower: 1.5-mm body; 3-mm high load cup</text><text x="310" y="287" class="small">Ø22 body; eyelets at ±20 mm; bores 2.2 / 2.3 / 2.3 / 2.4.</text>
<rect x="154" y="308" width="20" height="5" class="steel"/><rect x="186" y="308" width="20" height="5" class="steel"/><text x="250" y="318">Optional steel washer bonded underneath</text><text x="250" y="339" class="small">M2 DIN125 Ø5/2.2 or M5 DIN125 Ø10/5.3; measure actual.</text>
<path d="M85 394 H153 V375 H173 V394 H187 V375 H207 V394 H275 V410 H85 Z" class="part"/><text x="310" y="388">Hand-rotated input Ø22 × 2 mm</text><text x="310" y="409" class="small">2-mm raised contact: Ø4.7/2.4 or Ø10/5.4 annulus.</text>
<path d="M60 505 H152 V480 H208 V505 H300 V522 H60 Z" class="part"/><text x="330" y="491">28 × 28 × 2 base; central Ø6 boss reaches z5</text><text x="330" y="513" class="small">Input rotates on boss; this drag affects hand effort.</text>
<path d="M110 245 V360" class="force"/><text x="25" y="363" class="small">Gravity load</text><text x="25" y="382" class="small">crosses face.</text>
<text x="700" y="105" class="title">Top view / measurement</text><circle cx="840" cy="260" r="77" class="part"/><rect x="700" y="245" width="280" height="30" class="part"/><circle cx="700" cy="260" r="9" fill="white" stroke="#247e83"/><circle cx="980" cy="260" r="9" fill="white" stroke="#247e83"/><circle cx="840" cy="260" r="56" class="part"/><circle cx="840" cy="260" r="48" fill="white" stroke="#247e83"/><circle cx="840" cy="260" r="7" class="steel"/><path d="M840 350 H980" class="dim"/><text x="860" y="374">20.0 mm</text><path d="M980 250 V150" class="force"/><text x="880" y="137">Horizontal F</text><text x="700" y="410">T [N mm] = F [N] × actual arm [mm]</text><text x="700" y="440">Pull tangentially; level with eyelet.</text><text x="700" y="465">Keep load centred. Check rocking.</text><text x="700" y="490">Reverse direction and repeat.</text><text x="700" y="515">Guide drag is not magically removed.</text>
<rect x="25" y="555" width="1050" height="158" rx="8" fill="#eef5f7"/><text x="45" y="584">Load path: weights + follower → friction interface → input → base boss → table.</text><text x="45" y="610">This deliberately loads the interface. It does not validate magnetic force or terrain-load isolation.</text><text x="45" y="636">OFF proxy = follower + optional washer weight only. Record that preload; it is not zero normal force.</text><text x="45" y="662">A 0.001 N gauge at 20 mm resolves 0.020 N mm. Smaller readings are “below resolution”, never zero.</text><text x="45" y="688">All parts lie flat on the print plate; supports/brim OFF. No electrical or high-voltage parts are printed.</text>
</svg>
