<text x="365" y="110" class="">Pin 4,4 mm; midden: top Z51,1</text>
<text x="365" y="132" class="">7,1 mm boven frame; veilige uitersten 5,6 / 8,6</text>
<polyline points="238,122 350,122" fill="none" stroke="#444" stroke-width="2"/>
<text x="365" y="176" class="">Vierkante geleiding 4,8 × 4,8; Z36–44</text>
<text x="365" y="210" class="">Bestaande .175-mm-passing; spoed 3</text>
<text x="365" y="249" class="">Keeper Z28,9: 0,3 mm boven schroefvoet</text>
<text x="365" y="277" class="">Vierkante voet 10 × 10 × 2,4 in socket 10,4</text>
<text x="365" y="304" class="">M3-ring 3,2 / 7 / 0,50; steunvlak Z23,7</text>
<text x="365" y="328" class="">Lagerhals Ø3 in Ø3,5; geen motorlast</text>
<text x="365" y="355" class="">Slang ID2 / OD4; lengte 6,5; 1:1</text>
<text x="365" y="378" class="">≈1 mm lucht tussen tandwiel en geprinte stift</text>
<polyline points="268,308 350,308" fill="none" stroke="#444" stroke-width="2"/>
<polyline points="235,374 350,374" fill="none" stroke="#444" stroke-width="2"/>
<polyline points="310,268 310,311 328,311 328,338" fill="none" stroke="#9e3328" stroke-width="2" marker-end="url(#arrow)"/>
<text x="365" y="478" class="">Lastpad: pin → draad → voet → houder → ring → frame</text>
<text x="25" y="535" class="">Framehelften sluiten met drie kabelbinders; motorhuis krijgt een dunne papierpakking.</text>
<text x="25" y="560" class="">Printproject: vijf delen op één plaat. Geen draadnabewerking, smering of destructieve motoraanpassing.</text>
<text x="25" y="585" class="">Werkelijke slanggrip, lagerwrijving, motorstroom en bewegingssnelheid moeten nog fysiek worden getest.</text>
