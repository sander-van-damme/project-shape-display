<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#34495e"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#1c2c3c}.title{font-size:24px;font-weight:bold}.sub{font-size:15px}.label{font-size:16px}.small{font-size:13px}</style>
<text x="28" y="35" class="title">E-305 · exploded functional assembly</text>
<text x="28" y="65" class="sub">15 cell-associated pieces; supports and retention counted. Concept only.</text>
<rect x="80" y="95" width="180" height="57" fill="#7fb3d5" stroke="#34495e"/>
<text x="30" y="127" class="label">1</text>
<text x="300" y="117" class="label">Pin + integral screw/extension (2 pieces)</text>
<text x="300" y="142" class="small">Terrain force → screw collar → frame</text>
<path d="M170 157L170 186" fill="none" stroke="#34495e" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="80" y="194" width="180" height="57" fill="#c0c8d0" stroke="#34495e"/>
<text x="30" y="226" class="label">2</text>
<text x="300" y="216" class="label">Two frame halves + 4 thrust washers (6)</text>
<text x="300" y="241" class="small">Separate screw and input radial/thrust support</text>
<path d="M170 256L170 285" fill="none" stroke="#34495e" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="80" y="293" width="180" height="57" fill="#90cfb2" stroke="#34495e"/>
<text x="30" y="325" class="label">3</text>
<text x="300" y="315" class="label">Shared-drive input gear + conical socket (1)</text>
<text x="300" y="340" class="small">Ø13 gear / Ø10 contact outer diameter</text>
<path d="M170 355L170 384" fill="none" stroke="#34495e" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="80" y="392" width="180" height="57" fill="#f5d37b" stroke="#34495e"/>
<text x="30" y="424" class="label">4</text>
<text x="300" y="414" class="label">Sliding carrier (1)</text>
<text x="300" y="439" class="small">Keyed to output; 0.60-mm movement; no spring</text>
<path d="M170 454L170 483" fill="none" stroke="#34495e" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="80" y="491" width="180" height="57" fill="#e88484" stroke="#34495e"/>
<text x="30" y="523" class="label">5</text>
<text x="300" y="513" class="label">Axial magnet + retaining film (2)</text>
<text x="300" y="538" class="small">Ø3 ×2; N up; electrically passive</text>
<path d="M170 553L170 582" fill="none" stroke="#34495e" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="80" y="590" width="180" height="57" fill="#d99b52" stroke="#34495e"/>
<text x="30" y="622" class="label">6</text>
<text x="300" y="612" class="label">Bobbin body + top flange + wound coil (3)</text>
<text x="300" y="637" class="small">Fixed; 140 turns; 2 coil terminals</text>
<text x="28" y="725" class="sub">Additional: two bonding operations, winding/terminations, shared fasteners, drive train and electronics.</text>
<text x="28" y="753" class="sub">Exploded spacing is illustrative. Section drawing and CAD define the nominal envelope.</text>
</svg>