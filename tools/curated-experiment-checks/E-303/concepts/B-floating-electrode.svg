<text x="1040" y="615" class="">Two stationary fabric brushes</text>
<text x="1040" y="641" class="">Two rotating 1 mm tracks</text>
<text x="1040" y="666" class="">2 mm track separation</text>
<line x1="1020" y1="600" x2="1030" y2="600" class="line"/>
<line x1="1020" y1="655" x2="1030" y2="655" class="line"/>
<line x1="925" y1="218" x2="925" y2="246" class="load"/>
<text x="775" y="202" class="">Pin load ↓ through screw + collar to frame</text>
<text x="705" y="699" class="">Gray: stationary split frame. Blue: independent rotors.</text>
<text x="705" y="722" class="">Journal/bore: output 2.0/2.3; input 3.0/3.3.</text>
<text x="705" y="744" class="small">0.10 endplay exceeds nominal 0.05 gap: assembly blocker.</text>
<text x="35" y="800" class="h">3  Exploded active stack</text>
<rect x="170" y="860" width="64" height="30" fill="#bfdbfe" stroke="#334155"/>
<text x="290" y="882" class="">Output hub Ø3.2, bond at center only</text>
<rect x="112" y="934" width="180" height="5" fill="#cbd5e1" stroke="#334155"/>
<text x="320" y="939" class="">Floating metallized PET, Ø9</text>
<text x="320" y="963" class="">Al face DOWN; compliant outer annulus</text>
<rect x="102" y="1004" width="200" height="5" fill="#34d399" stroke="#334155"/>
<text x="320" y="1009" class="">PET dielectric, 12 µm</text>
<text x="320" y="1033" class="">Outer-edge attachment, no active-area glue</text>
<rect x="112" y="1070" width="85" height="5" fill="#f97316" stroke="#334155"/>
<rect x="205" y="1070" width="87" height="5" fill="#f59e0b" stroke="#334155"/>
<text x="320" y="1076" class="">Two insulated copper sectors, 35 µm</text>
<rect x="102" y="1140" width="200" height="40" fill="#93c5fd" stroke="#334155"/>
<rect x="172" y="1180" width="60" height="50" fill="#93c5fd" stroke="#334155"/>
<text x="320" y="1167" class="">Input printed hub, Ø10 carrier</text>
<line x1="202" y1="900" x2="202" y2="923" class="dim"/>
<text x="35" y="927" class="">Flexes to close</text>
<text x="35" y="954" class="">gap; release</text>
<text x="35" y="979" class="">force unknown</text>
<text x="35" y="1270" class="">Films / tracks / wires are purchased parts, not printable layers.</text>
<text x="705" y="800" class="h">4  Electrical and torque paths</text>
<text x="715" y="859" class="">Stationary controller</text>
<rect x="740" y="882" width="110" height="48" fill="#f1f5f9" stroke="#334155"/>
<text x="758" y="913" class="">V1 / E1</text>
<rect x="1120" y="882" width="110" height="48" fill="#f1f5f9" stroke="#334155"/>
<text x="1138" y="913" class="">V2 / E2</text>
<line x1="850" y1="906" x2="925" y2="906" class="line"/>
<line x1="925" y1="884" x2="925" y2="928" class="line"/>
<line x1="940" y1="884" x2="940" y2="928" class="line"/>
<line x1="940" y1="906" x2="1040" y2="906" class="line"/>
<line x1="1040" y1="884" x2="1040" y2="928" class="line"/>
<line x1="1055" y1="884" x2="1055" y2="928" class="line"/>
<line x1="1055" y1="906" x2="1120" y2="906" class="line"/>
<text x="913" y="869" class="">C1</text>
<text x="1028" y="869" class="">C2</text>
<circle cx="989" cy="906" r="4" fill="#334155" stroke="#334155"/>
<line x1="989" y1="906" x2="989" y2="975" class="line"/>
<text x="935" y="1000" class="">Floating output Vf</text>
<text x="720" y="1051" class="">Vf = (C1 V1 + C2 V2 + Cp Vp + Qf) / (C1+C2+Cp)</text>
<text x="720" y="1080" class="">Balanced, neutral, negligible Cp → Vf = (V1+V2)/2</text>
<text x="720" y="1109" class="">B2 pressure and Ceq = 1/4 of B1 at same terminal ΔV.</text>
<text x="720" y="1149" class="">Each input lead crosses its own rotating track/brush.</text>
<text x="720" y="1180" class="">Torque: input → copper/PET friction → floating film</text>
<text x="720" y="1207" class="">→ central bond → screw. Film bond/shear must survive.</text>
<text x="720" y="1245" class="">Closed contact: attraction balances contact locally;</text>
<text x="720" y="1272" class="">collars take net elastic/preload + terrain reactions.</text>
<line x1="25" y1="1305" x2="1375" y2="1305" class="line"/>
<text x="35" y="1338" class="h">Count every repeated item</text>
<text x="35" y="1370" class="">12 minimum items: 2 printed rotors + 1 floating film + 2 sectors + 1 PET dielectric + 2 tracks + 2 brushes + 2 links.</text>
<text x="35" y="1400" class="">Also: guided pin; two module-shared housing halves; closure hardware; measured shims if needed; eight adhesive bond operations.</text>
<text x="35" y="1430" class="">No sleeve, ball bearing or separate return spring. Film and brushes flex. Supports, endplay, wear, leakage and release remain unverified.</text>
</svg>