<text x="365" y="153" class="">Split gap 0.40</text>
<text x="125" y="296" class="">E1</text>
<text x="325" y="296" class="">E2</text>
<text x="175" y="510" class="">Equal sectors: each sees ΔV / 2</text>
<text x="35" y="550" class="">Floating Ø9 film faces both sectors; no output wire.</text>
<text x="35" y="580" class="">Central Ø3.2 bond land transfers torque to screw.</text>
<text x="35" y="610" class="">0.5 mm carrier edge border is geometric allowance,</text>
<text x="35" y="634" class="">not verified insulation clearance for any voltage.</text>
<text x="35" y="675" class="">At 5.08 pitch: Ø5 leaves only 0.08 mm clearance.</text>
<text x="35" y="700" class="">Ø10 needs staggering; four levels leave only 0.16 mm</text>
<text x="35" y="724" class="">between equal-height discs, before wiring/supports.</text>
<text x="705" y="112" class="h">2  Axial section and separate supports</text>
