<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1480" viewBox="0 0 1400 1480"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155"/></marker><style>text{font-family:Arial,sans-serif;fill:#172a40;font-size:16px}.title{font-size:26px;font-weight:bold}.h{font-size:20px;font-weight:bold}.small{font-size:14px}.dim{stroke:#334155;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}.line{stroke:#334155;fill:none;stroke-width:1.5}.load{stroke:#b91c1c;fill:none;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="1480" fill="#fff"/>
<text x="32" y="40" class="title">B2-10 — floating-output electrostatic clutch concept</text>
<text x="32" y="68" class="small">Dimensions in mm. Packaging / force-path study only. Films enlarged in section; no high-voltage or print release.</text>
<line x1="680" y1="90" x2="680" y2="1300" class="line"/>
<line x1="25" y1="760" x2="1375" y2="760" class="line"/>
<text x="35" y="112" class="h">1  Top view: powered input</text>
