<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><defs><style>text{font-family:Arial,sans-serif;fill:#172b3a;font-size:18px}.title{font-size:26px;font-weight:bold}.small{font-size:15px}.wire{stroke:#172b3a;stroke-width:2.5;fill:none}.box{fill:#e8f2f6;stroke:#31728c;stroke-width:2}.note{fill:#fff4d9;stroke:#b88925;stroke-width:1.5}</style></defs><rect width="1100" height="600" fill="white"/><text class="title" x="30" y="38">E-303 · stationary, latched coil selection</text><text x="30" y="68">One of 64 local channels per module · conceptual circuit, no hardware validation</text><rect class="box" x="30" y="170" width="195" height="135" rx="8"/><text x="48" y="202">74HCT595 at 5 V</text><text class="small" x="48" y="231">SER / CLOCK / LATCH</text><text class="small" x="48" y="254">/OE high → high-Z</text><text class="small" x="48" y="280">8 outputs per device</text><path class="wire" d="M225 230H275 M340 230H425V305H470"/><rect x="275" y="220" width="65" height="20" fill="white" stroke="#172b3a" stroke-width="2"/><text class="small" x="280" y="209">1 kΩ</text><path class="wire" d="M395 230V335 M395 385V445H520 M520 365V445 M520 275V205 M520 205V160 M520 100V85H875 M470 275V365 M485 285H510 M485 355H510"/><rect x="385" y="335" width="20" height="50" fill="white" stroke="#172b3a" stroke-width="2"/><text class="small" x="287" y="364">100 kΩ</text><path class="wire" d="M510 285V355 M510 320H542 M510 285H520V275 M510 355H520V365"/><text x="550" y="327">Q1 AO3400A</text><text class="small" x="550" y="352">logic-level N-MOSFET</text><rect class="box" x="498" y="100" width="44" height="60"/><text x="557" y="140">stationary coil</text><path class="wire" d="M520 205H820V160 M820 100V85"/><path d="M803 152L820 116L837 152Z" fill="white" stroke="#172b3a" stroke-width="2"/><path class="wire" d="M802 112H838 M820 112V100 M820 152V160"/><text x="858" y="123">D1 flyback</text><text class="small" x="858" y="147">cathode at +Vcoil</text><text class="small" x="858" y="170">anode at drain</text><text x="700" y="99">+Vcoil, regulated / fused</text><path class="wire" d="M500 451H540 M506 458H534 M513 465H527"/><text x="550" y="450">common GND</text><rect class="note" x="30" y="490" width="1040" height="80" rx="6"/><text class="small" x="47" y="518">Per clutch: coil + MOSFET + diode + 2 resistors + 1/8 latch IC; PCB, decoupling and supply hardware are additional.</text><text class="small" x="47" y="543">Initialize with /OE inactive; use a level-safe enable interface. Coil release is delayed by current decay and remanence.</text><text class="small" x="30" y="385">100 modules × 64 channels = 6,400</text><text class="small" x="30" y="408">Shared command bus; local load wires remain.</text></svg>