<text x="790" y="793" class="h">UNRESOLVED MANUFACTURING REQUIREMENTS</text>
<text x="790" y="829" class="s">• No steel machining: head/yoke contact must still be measured.</text>
<text x="790" y="861" class="s">• Washer dish, screw length and runout must not close pole gaps.</text>
<text x="790" y="893" class="s">• Output collar requires measured shimming to≤0.02 endplay.</text>
<text x="790" y="925" class="s">• Zero-force carrier neutral position is not set by FDM alone.</text>
<text x="790" y="957" class="s">• Carrier stiffness≈1.06 N/mm is a simple beam estimate.</text>
<text x="790" y="989" class="s">• 0.05 mm stack error can add≈0.053 N unwanted preload.</text>
<text x="790" y="1021" class="s">• 12.4 mm housing exceeds four-height10.16 mm spacing.</text>
<text x="790" y="1053" class="s">• Adhesive and thin-film shim are real assembly operations.</text>
<text x="790" y="1085" class="s">• Concept envelopes must NOT be sent to the printer.</text>
<text x="28" y="1179" class="s">Green stationary • Blue output • Brown input • Grey steel • Orange winding • Red terrain load</text>
</svg>