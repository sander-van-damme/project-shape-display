metadata:
  id: template_staircase
  description: "3 x 3 staircase for a single XY-Z plunger"
  random_seed: 0

grid:
  columns: 3
  rows: 3
  pitch_mm: 8.5

pin:
  diameter_mm: 5.0
  body_height_mm: 35.0
  height_steps_mm: [0.0, 5.0, 10.0, 15.0, 20.0]
  clearance_mm: 0.2

mechanism:
  actuator_type: plunger
  actuator_count: 1
  xy_speed_mm_s: 80.0
  z_speed_mm_s: 40.0
  settle_time_s: 0.02
  detent_force_n: 2.0

simulation:
  engine: kinematic
  timestep_s: 0.002
  target_heights_mm:
    - [0.0, 5.0, 10.0]
    - [5.0, 10.0, 15.0]
    - [10.0, 15.0, 20.0]

validation:
  height_tolerance_mm: 0.05
  maximum_reconfiguration_time_s: 8.0
