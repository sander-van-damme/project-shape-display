<rect x="888" y="609" width="286" height="27" rx="1" fill="#dfaa50" stroke="#16343a" stroke-width="1.2"/>
<rect x="911" y="636" width="14" height="34" rx="1" fill="#dfaa50" stroke="#16343a" stroke-width="1.2"/>
<rect x="911" y="657" width="30" height="7" rx="1" fill="#73868e" stroke="#16343a" stroke-width="1.2"/>
<rect x="942" y="650" width="11" height="25" rx="1" fill="#8060a1" stroke="#16343a" stroke-width="1.2"/>
<text x="889" y="720" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#16343a" text-anchor="start">Plaat thuis · pal vrij</text>
<rect x="75" y="682" width="1200" height="8" rx="1" fill="#d87740" stroke="#16343a" stroke-width="1.2"/>
<text x="83" y="764" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#16343a" text-anchor="start">Schuifstang met tien nokken beweegt 1,5 mm langs x. Eén blokkerende pal houdt de gemeenschappelijke rijpen gevangen.</text>
<text x="83" y="789" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#4d686e" text-anchor="start">Elke pal valt door eigen bladveer in de blokkeerstand. Alleen de bijbehorende stalen plaattong kan haar lichten.</text>
<rect x="30" y="827" width="1440" height="180" rx="10" fill="#fff" stroke="#d0dbdb"/>
<text x="48" y="861" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#16343a" text-anchor="start">Mechanische volgorde en lokale ondersteuning</text>
<text x="49" y="893" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#16343a" text-anchor="start">1  Drukas</text>
<text x="253" y="893" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#16343a" text-anchor="start">Tien nokken op Ø6-as drukken 10 × 8 oren omlaag. Bovenlip van elke vork vangt de collar.</text>
<text x="49" y="922" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#16343a" text-anchor="start">2  Meetschuif</text>
<text x="253" y="922" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#16343a" text-anchor="start">Tweede nok spant tien begrensde vingers. Rechte plaatneuzen lopen tussen boven- en ondergeleiders.</text>
<text x="49" y="951" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#16343a" text-anchor="start">3  Rijverplaatsing</text>
<text x="253" y="951" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#16343a" text-anchor="start">Doorlopende sleutelstang valt achter alle tien plaatstaarten. De platen blijven boven de conussen.</text>
<text x="49" y="980" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#16343a" text-anchor="start">4  Volgende rij</text>
<text x="253" y="980" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#16343a" text-anchor="start">Rijpen moet eerst in een indexgat vallen. Pas dan kan de sleutelstang terug en de meetlaag open.</text>
</svg>