<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<rect x="0" y="0" width="1500" height="1040" rx="1" fill="#f1f5f4" stroke="#16343a" stroke-width="1.2"/>
<text x="35" y="50" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#16343a" text-anchor="start">Parkeren vraagt twee bewegingen</text>
<text x="35" y="82" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#16343a" text-anchor="start">Eerst trekt de vork de conus uit de cup. Daarna tast een stalen plaat de werkelijke baan van de stift af.</text>
<rect x="30" y="110" width="470" height="350" rx="10" fill="#fff" stroke="#d0dbdb"/>
<text x="44" y="145" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#16343a" text-anchor="start">Gesloten bij vrije conus</text>
<polygon points="250.00,354.00 290.00,354.00 290.00,326.00 250.00,326.00" fill="#218480" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="232.00,278.00 224.00,278.00 224.00,238.00 270.00,238.00 270.00,250.28 248.00,250.28" fill="#9baeb0" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="308.00,278.00 316.00,278.00 316.00,238.00 270.00,238.00 270.00,250.28 292.00,250.28" fill="#9baeb0" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="228.00,378.00 312.00,378.00 312.00,362.00 228.00,362.00" fill="#218480" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="232.00,326.00 308.00,326.00 292.00,298.28 248.00,298.28" fill="#218480" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="154.00,290.80 314.00,290.80 314.00,284.80 154.00,284.80" fill="#dfaa50" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/>
<text x="45" y="418" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#16343a" text-anchor="start">Plaat overlapt de as tot y +2,20.</text>
<text x="45" y="443" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#16343a" text-anchor="start">Rijpen mag vrij na alle tien modules.</text>
<rect x="520" y="110" width="470" height="350" rx="10" fill="#fff" stroke="#d0dbdb"/>
<text x="534" y="145" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#16343a" text-anchor="start">Geopend bij aandrijving</text>
<polygon points="740.00,354.00 780.00,354.00 780.00,278.00 740.00,278.00" fill="#218480" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="722.00,278.00 714.00,278.00 714.00,238.00 760.00,238.00 760.00,250.28 738.00,250.28" fill="#9baeb0" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="798.00,278.00 806.00,278.00 806.00,238.00 760.00,238.00 760.00,250.28 782.00,250.28" fill="#9baeb0" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="718.00,330.00 802.00,330.00 802.00,314.00 718.00,314.00" fill="#218480" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="722.00,278.00 798.00,278.00 782.00,250.28 738.00,250.28" fill="#218480" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="556.00,290.80 716.00,290.80 716.00,284.80 556.00,284.80" fill="#dfaa50" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/>
<text x="535" y="418" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#16343a" text-anchor="start">De plaatneus staat op y −2,20.</text>
<text x="535" y="443" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#16343a" text-anchor="start">Rijpen zit in het indexgat.</text>
<rect x="1010" y="110" width="470" height="350" rx="10" fill="#fff" stroke="#d0dbdb"/>
<text x="1024" y="145" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#16343a" text-anchor="start">Storing tijdens reset</text>
<polygon points="1230.00,354.00 1270.00,354.00 1270.00,278.00 1230.00,278.00" fill="#218480" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="1212.00,278.00 1204.00,278.00 1204.00,238.00 1250.00,238.00 1250.00,250.28 1228.00,250.28" fill="#9baeb0" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="1288.00,278.00 1296.00,278.00 1296.00,238.00 1250.00,238.00 1250.00,250.28 1272.00,250.28" fill="#9baeb0" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="1208.00,330.00 1292.00,330.00 1292.00,314.00 1208.00,314.00" fill="#218480" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="1212.00,278.00 1288.00,278.00 1272.00,250.28 1228.00,250.28" fill="#218480" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/><polygon points="1070.00,290.80 1230.00,290.80 1230.00,284.80 1070.00,284.80" fill="#dfaa50" stroke="#16343a" stroke-width="0.72" stroke-linejoin="round"/>
<text x="1025" y="418" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#16343a" text-anchor="start">Een hoge stift stopt de plaatneus.</text>
<text x="1025" y="443" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#16343a" text-anchor="start">Rijpen blijft in het indexgat.</text>
<rect x="30" y="477" width="1440" height="332" rx="10" fill="#fff" stroke="#d0dbdb"/>
<text x="49" y="514" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#16343a" text-anchor="start">Bovenaanzicht  /  tien onafhankelijke sluitplaten van acht kanalen</text>
<text x="49" y="545" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#16343a" text-anchor="start">Drie modules afgebeeld. Midden blijft achter door één geblokkeerde stift.</text>
