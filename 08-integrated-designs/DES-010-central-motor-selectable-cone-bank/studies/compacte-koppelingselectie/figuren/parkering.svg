<text x="484" y="720" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#16343a" text-anchor="start">Plaat gestopt · pal blokkeert</text>
<circle cx="905" cy="613" r="11" fill="#edf1f0" stroke="#16343a"/>
