<text x="510" y="741" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="650" fill="#16343a" text-anchor="start">Magneet Ø2 × 2, poolafstand circa 5,2, één axiale spoel.</text>
<text x="510" y="785" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#16343a" text-anchor="start">De verticale drukstang loopt door de bovenste open poolschoen.</text>
<text x="510" y="819" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#16343a" text-anchor="start">De onderste pool houdt de ruststand, de bovenste moet de cupdruk dragen.</text>
<text x="510" y="853" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#16343a" text-anchor="start">Bij het losbreken bedraagt de afstand tot de doelpool nog circa 3 mm.</text>
<text x="510" y="887" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#16343a" text-anchor="start">Het nokalternatief gebruikt hetzelfde ene pulskanaal en een mechanische reset.</text>
<text x="46" y="987" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#4d686e" text-anchor="start">Bank in plan op schaal langs x. y-afstanden en afzonderlijke magneetdoorsneden ter verduidelijking uitvergroot.</text>
