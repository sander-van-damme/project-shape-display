name: engineering-checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engineering-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test08 deterministic engineering checks
        run: python 06-experiments/test08_architecture_search/checks.py
      - name: Test09 validation workflow
        run: python 06-experiments/test09_test08_validation/run.py
      - name: Test10 architecture scale bounds
        run: python 06-experiments/test10_broad_architecture_screen/checks.py
      - name: Test11 cost/printability/reliability checks
        run: python 06-experiments/test11_cost_printability_reliability/checks.py
      - name: Test11 delivered-BOM checks
        run: python 06-experiments/test11_cost_printability_reliability/delivered_3scenario/checks.py
      - name: Test11 shared-drive rejection gates
        run: |
          python 06-experiments/test11_shared_drive_gate_analysis/checks.py
          python 06-experiments/test11_shared_drive_gate_analysis/coupon_geometry.py
          python 06-experiments/test11_shared_drive_gate_analysis/make_coupon_stl.py
          python 06-experiments/test11_shared_drive_gate_analysis/verify_coupon_stl.py
      - name: T11-A fit-coupon gate engine (synthetic self-test + schema + prediction)
        run: |
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --selftest
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --validate
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --predict
      - name: "T11-A analytic gate (DND-28 re-scope: printability + tolerance/MC)"
        run: |
          python 06-experiments/test11_shared_drive_gate_analysis/analytic/t11a_analytic_gate.py --selftest
          python 06-experiments/test11_shared_drive_gate_analysis/analytic/t11a_analytic_gate.py --emit-record
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --input 06-experiments/test11_shared_drive_gate_analysis/analytic/runs/t11a_analytic_measurements.csv
      - name: Test11 S1/S2 rejection screen
        run: python 06-experiments/test11_threshold_ratchet_s1/checks.py
      - name: Test11 printable coupon generation and structural checks
        run: |
          cd 06-experiments/test11_threshold_ratchet_s1
          python build_coupon.py
          python coupon_checks.py
      - name: Test11 falsification arithmetic
        run: python 06-experiments/test11_falsification_library/checks.py
      - name: Test11 isolation-rig gate engine (self-test + schema)
        run: |
          python 06-experiments/test11_falsification_library/isolation_rig_runner.py --validate
          python 06-experiments/test11_falsification_library/isolation_rig_runner.py --selftest
      - name: "J2 analytic isolation gate (DND-28 re-scope: rail bound + stiction + fit)"
        run: |
          python 06-experiments/test11_falsification_library/analytic/j2_analytic_gate.py --selftest
          python 06-experiments/test11_falsification_library/analytic/j2_analytic_gate.py --emit-record
          python 06-experiments/test11_falsification_library/isolation_rig_runner.py --input 06-experiments/test11_falsification_library/analytic/runs/isolation_analytic.csv
      - name: Test11 fixture geometry gate
        run: python 06-experiments/test11_falsification_library/check_fixture.py

  j2-cad-render:
    # Renders the J2 isolation-rig fixture with a real OpenSCAD and probes the
    # holder's interchangeable-fixture socket for exposure. Separate job so the
    # stdlib-only engineering-checks job stays fast; OpenSCAD is a heavy apt
    # dependency. A missing OpenSCAD here is a hard failure, not a SKIP: this is
    # the job whose whole purpose is the render, so a silent skip would defeat it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Render every J2 part + probe the fixture socket
        run: |
          which openscad
          python 06-experiments/test11_falsification_library/check_fixture.py

  geometry-validation-harness:
    # The software-only replacement for a print test (DND-29): real OpenSCAD
    # render -> mesh validation -> sourced analytic printability gate.
    # A missing OpenSCAD here fails the job (--require-openscad) so the render
    # step can never silently skip in the job whose purpose is the render.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Run the geometry validation harness
        run: |
          python tools/validate/validate_geometry.py \
            --require-openscad --json harness-record.json
      - name: Printability table (standalone, sourced limits)
        # A printability FAIL is a DESIGN finding, not a tool error, so this
        # step exits 0 and the table is kept as evidence. Only a tool error
        # (exit 2) fails the step. Gate on a design FAIL explicitly with
        # --fail-on-design-fail if a downstream stage needs that.
        run: |
          python tools/validate/analytic_printability.py \
            --json printability-record.json \
            06-experiments/test11_shared_drive_gate_analysis/selector_fanout_coupon.scad
      - name: Upload harness records
        uses: actions/upload-artifact@v4
        with:
          name: geometry-validation-record
          path: |
            harness-record.json
            printability-record.json
          if-no-files-found: warn

