name: test-platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python tests/template/simulation.py --engine kinematic
      - uses: actions/upload-artifact@v4
        with:
          name: template-simulation-results
          path: tests/template/results/

  physics-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [mujoco, pybullet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt ${{ matrix.engine }}
      - run: python tests/template/simulation.py --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.engine }}-results
          path: tests/template/results/
