name: engineering-checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engineering-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # buckling_closure.py (Test12 DND-44 K1) imports numpy via test08's
        # cam_strength.py. The runner's system python may or may not ship numpy;
        # pinning it here makes the DND-44 closure step deterministic.
        run: python -m pip install --quiet "numpy>=1.26"
      - name: Test08 deterministic engineering checks
        run: python 06-experiments/test08_architecture_search/checks.py
      - name: Test09 validation workflow
        run: python 06-experiments/test09_test08_validation/run.py
      - name: Test10 architecture scale bounds
        run: python 06-experiments/test10_broad_architecture_screen/checks.py
      - name: Test11 cost/printability/reliability checks
        run: python 06-experiments/test11_cost_printability_reliability/checks.py
      - name: Test11 delivered-BOM checks
        run: python 06-experiments/test11_cost_printability_reliability/delivered_3scenario/checks.py
      - name: Test11 shared-drive rejection gates
        run: |
          python 06-experiments/test11_shared_drive_gate_analysis/checks.py
          python 06-experiments/test11_shared_drive_gate_analysis/coupon_geometry.py
          python 06-experiments/test11_shared_drive_gate_analysis/make_coupon_stl.py
          python 06-experiments/test11_shared_drive_gate_analysis/verify_coupon_stl.py
      - name: T11-A fit-coupon gate engine (synthetic self-test + schema + prediction)
        run: |
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --selftest
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --validate
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --predict
      - name: "T11-A analytic gate (DND-28 re-scope: printability + tolerance/MC)"
        run: |
          python 06-experiments/test11_shared_drive_gate_analysis/analytic/t11a_analytic_gate.py --selftest
          python 06-experiments/test11_shared_drive_gate_analysis/analytic/t11a_analytic_gate.py --emit-record
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --input 06-experiments/test11_shared_drive_gate_analysis/analytic/runs/t11a_analytic_measurements.csv
      - name: Test11 S1/S2 rejection screen
        run: python 06-experiments/test11_threshold_ratchet_s1/checks.py
      - name: Test11 printable coupon generation and structural checks
        run: |
          cd 06-experiments/test11_threshold_ratchet_s1
          python build_coupon.py
          python coupon_checks.py
      - name: Test11 falsification arithmetic
        run: python 06-experiments/test11_falsification_library/checks.py
      - name: Test11 isolation-rig gate engine (self-test + schema)
        run: |
          python 06-experiments/test11_falsification_library/isolation_rig_runner.py --validate
          python 06-experiments/test11_falsification_library/isolation_rig_runner.py --selftest
      - name: "J2 analytic isolation gate (DND-28 re-scope: rail bound + stiction + fit)"
        run: |
          python 06-experiments/test11_falsification_library/analytic/j2_analytic_gate.py --selftest
          python 06-experiments/test11_falsification_library/analytic/j2_analytic_gate.py --emit-record
          python 06-experiments/test11_falsification_library/isolation_rig_runner.py --input 06-experiments/test11_falsification_library/analytic/runs/isolation_analytic.csv
      - name: Test11 fixture geometry gate
        run: python 06-experiments/test11_falsification_library/check_fixture.py
      - name: Test12 winner convergence stack-up (DND-35)
        run: |
          cd 06-experiments/test12_winner_convergence
          python checks.py
          python model.py > /dev/null
          python ratify_bom.py --selftest
      - name: Test12 DND-47 independent cost-closure ratification
        run: |
          cd 06-experiments/test12_winner_convergence
          python cost_closure_ratify.py
          python cost_closure_ratify.py --selftest
      - name: Test12 analytic detent contact sweep (DND-38, K2)
        run: |
          cd 06-experiments/test12_winner_convergence
          python detent_contact.py > /dev/null
          python detent_checks.py
      - name: Test12 K2 scallop sweep + K9 angular-margin MC (DND-45)
        run: |
          cd 06-experiments/test12_winner_convergence
          python k9_angular_margin.py > /dev/null
          python k9_checks.py
      - name: Test12 DND-44 readiness closures (K1/K5/K6/K8/K10/K11)
        run: |
          cd 06-experiments/test12_winner_convergence
          python timing_closure.py > /dev/null
          python timing_closure_checks.py
          python buckling_closure.py > /dev/null
          python buckling_closure_checks.py
          python cost_closure.py > /dev/null
          python cost_closure_checks.py
          python cross_cutting_closure.py > /dev/null
          python cross_cutting_closure_checks.py
      - name: Test12 K7 matched-motor sourcing trace (DND-49)
        run: |
          cd 06-experiments/test12_winner_convergence
          python k7_motor_trace.py > /dev/null
          python k7_motor_trace_checks.py
      - name: Test12 DND-52 head-actuator / drive-topology pivot screen
        run: |
          cd 06-experiments/test12_winner_convergence
          python nx52_head_actuator.py > /dev/null
          python nx52_head_actuator_checks.py
      - name: Test12 DND-54 S5-R register analytic + CAD model
        run: |
          cd 06-experiments/test12_winner_convergence
          python s5r_register.py > /dev/null
          python s5r_register_checks.py
      - name: DND-54 S5-R register-cell printability (sourced FDM limits)
        run: |
          python tools/validate/analytic_printability.py \
            --json s5r-printability-record.json \
            06-experiments/test12_winner_convergence/s5r_register.scad
      - name: Test12 DND-56 S5-R delivered-BOM independent ratification
        run: |
          cd 06-experiments/test12_winner_convergence
          python s5r_bom_ratify.py
          python s5r_bom_ratify.py --selftest
          python s5r_bom_ratify.py --emit-csv > /dev/null
          python s5r_bom_ratify_checks.py
      - name: Test12 DND-55 S5-R R=4 bank assembly (torsion + envelopes)
        run: |
          cd 06-experiments/test12_winner_convergence
          python s5r_bank.py > /dev/null
          python s5r_bank_checks.py
      - name: DND-55 S5-R bank-assembly printability (sourced FDM limits)
        run: |
          python tools/validate/analytic_printability.py \
            --json s5r-bank-printability-record.json \
            06-experiments/test12_winner_convergence/s5r_bank.scad
      - name: Test12 DND-59 S5-R residual retirement (keeper/writer/reliability/crank/ecc)
        run: |
          cd 06-experiments/test12_winner_convergence
          python s5r_residuals.py > /dev/null
          python s5r_residuals_checks.py
      - name: DND-59 S5-R register printability (2-line keeper must PASS)
        run: |
          python tools/validate/analytic_printability.py \
            --json s5r-register-printability-record.json \
            06-experiments/test12_winner_convergence/s5r_register.scad
      - name: Test12 DND-46 falsifier adversarial audit (attacks on K1/K5/K6/K8/K10/K11)
        run: |
          cd 06-experiments/test12_winner_convergence
          python falsifier_checks.py
      - name: Test12 DND-48 robust readiness register (robust figures in the docs)
        run: |
          cd 06-experiments/test12_winner_convergence
          python register_checks.py
      - name: Test13 Step-6 load/structure/power (DND-43)
        run: |
          cd 06-experiments/test13_step6_load_structure_power
          python checks.py
          python model.py > /dev/null
      - name: DND-64 promoted-machine README coherence gate
        # Fails if 08-current-design/README.md's promoted-machine headline
        # (machine name, actuator count, full-map time, delivered cost) drifts
        # from the promoted model s5r_register.py, or if the superseded
        # incumbent S5 is presented as the current machine / live register.
        run: python tools/validate/readme_s5r_coherence.py
      - name: DND-76 ultra-low-cost cell/mechanism primitives
        # CALCULATION-only screen over the sourced FDM limits: the four
        # primitives (friction-independent latch, printed mask comb, cell
        # guidance, single-actuator reset) for the <$250 architecture. No
        # print, no measurement (DND-27).
        run: |
          python 09-lowcost-alternative/primitives/primitives.py > /dev/null
          python 09-lowcost-alternative/primitives/primitives_checks.py
      - name: "DND-72 ultra-low-cost (<$250) variant screen + negative-result gate"
        # Pins the DND-72 negative result: the S5-R fixed base alone ($253.69
        # delivered) exceeds the $250 target; no sub-$250 configuration exists
        # in the exhaustive lever sweep; the requirement-preserving floor is
        # $345.90 (R6-W20-M2, 29.987 s). Fails if any headline drifts or the
        # promoted S5-R control numbers move.
        run: |
          python 09-low-cost-variant/s5r_ultra.py > /dev/null
          python 09-low-cost-variant/s5r_ultra_checks.py
      - name: "DND-72 selected machine S6-LC gate"
        # Pins the SELECTED architecture folded into the DND-72 track: the
        # S1-B broadcast threshold ratchet S6-LC at $139.77 parts / $162.13
        # delivered / 7.4 s, no per-cell/per-row bought actuator, banked
        # release force under ceiling. Fails if any gate or headline drifts.
        run: |
          python 09-low-cost-variant/s6lc/analysis/s6lc.py > /dev/null
          python 09-low-cost-variant/s6lc/analysis/s6lc_checks.py
      - name: "DND-72 folded divergent machines gate"
        # DND-75 divergence folded onto the DND-72 track: A1 single-shaft cam,
        # A2 hand-crank/tape, A3 S1-B banked broadcast; each clears <$250 and
        # <30 s. Runs the screen + 18 checks + analytic printability.
        run: python 09-low-cost-variant/divergent/tools/run_divergent_checks.py
      - name: "DND-73 S6-LC BOM ratification gate"
        # Independent ratification of the S6-LC BOM of record against the $250
        # purchased ceiling. Pins: the $139.77 parts / $162.13 delivered claim
        # reproduces on the additive x1.16 basis; 44% traced / 56% allowance is
        # disclosed; every cost-driving line has >2x break-even headroom; the
        # hostile scenario clears ($243.45); the stable order-tier re-price
        # clears at $152.32 and flags the under-priced T8/coupler lines; and the
        # honest finding that the off-BOM shared card puncher breaches $250
        # ($266.65) cannot be reversed.
        run: |
          python 09-low-cost-variant/s6lc/ratify/s6lc_bom_ratify.py > /dev/null
          python 09-low-cost-variant/s6lc/ratify/s6lc_bom_ratify.py --selftest
          python 09-low-cost-variant/s6lc/ratify/s6lc_bom_ratify_checks.py

  lowcost-cad-render:
    # DND-72: render the ultra-low-cost variant unit cell with a real OpenSCAD,
    # mesh-validate every committed part (watertight, bed-fitting) and run the
    # sourced analytic printability gate. A missing OpenSCAD here is a hard
    # failure (the render is the point). CAD + sourced-limit evidence only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Install mesh validation dependency
        # DND-82: trimesh's graph ops (body_count / split / merge_vertices)
        # require scipy, which `pip install trimesh` does NOT pull in; without it
        # the low-cost gate raised ModuleNotFoundError and failed the job.
        # Install scipy explicitly. watertight() is also now dependency-free, so
        # the gate still passes if scipy is ever absent.
        run: python -m pip install --quiet "trimesh>=4" "scipy>=1.11"
      - name: Re-render the low-cost variant parts (best-effort CAD refresh)
        # Refreshes the STLs from the SCAD when the runner's OpenSCAD can. The
        # committed STLs are the CAD artifacts that the gate below validates, so
        # a version-specific CGAL seam artifact here must not fail the gate.
        continue-on-error: true
        run: python 09-low-cost-variant/tools/render_lowcost_cad.py --render
      - name: Mesh-validate the committed low-cost variant CAD
        # Version-independent gate: validates the committed STLs (watertight,
        # bed-fitting, non-degenerate). The printability step below reads the
        # SCAD source directly. Together they are the CAD evidence; neither
        # depends on the runner's OpenSCAD version.
        run: python 09-low-cost-variant/tools/render_lowcost_cad.py --validate-only
      - name: Low-cost variant unit-cell printability (sourced FDM limits)
        run: |
          python tools/validate/analytic_printability.py \
            --fail-on-design-fail \
            --json s5r-ultra-printability-record.json \
            09-low-cost-variant/scad/s5r_ultra_cell.scad

  j2-cad-render:
    # Renders the J2 isolation-rig fixture with a real OpenSCAD and probes the
    # holder's interchangeable-fixture socket for exposure. Separate job so the
    # stdlib-only engineering-checks job stays fast; OpenSCAD is a heavy apt
    # dependency. A missing OpenSCAD here is a hard failure, not a SKIP: this is
    # the job whose whole purpose is the render, so a silent skip would defeat it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Render every J2 part + probe the fixture socket
        run: |
          which openscad
          python 06-experiments/test11_falsification_library/check_fixture.py

  lowcost-primitives-cad-render:
    # DND-76: render the ultra-low-cost primitive CAD (cell, mask comb, reset
    # bar) with a real OpenSCAD. A missing OpenSCAD is a hard failure here
    # because the render is the point. This is CAD evidence, not a print.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Render the primitive CAD parts
        run: python 09-lowcost-alternative/primitives/tools/render_primitives_cad.py

  winner-cad-render:
    # Renders the promoted winner (S5) coupon parts with a real OpenSCAD and
    # mesh-validates them (DND-35). This is the winner's CAD evidence; a missing
    # OpenSCAD is a hard failure here because the render is the point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Render + mesh-validate the winner coupon parts
        run: python 06-experiments/test12_winner_convergence/render_winner_cad.py

  fab-package:
    # DND-60/DND-61: render the COMPLETE S5-R printable part set with a real
    # OpenSCAD, mesh-validate every part, regenerate the print + assembly
    # manifests, and run the coherence gate (C1-C7). DND-61 renders the two
    # structural tiles at their true full size (the 27x27 cartridge is a single
    # ~10.5 min CGAL render), so no reduced witness blocks remain; C7 fails a
    # reduced witness that lacks a real envelope or a documented sub-tile route.
    # A missing OpenSCAD is a hard failure (the render is the point). This is
    # CAD + sourced-limit evidence, not a print.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Install mesh validation dependency
        run: python -m pip install --quiet "trimesh>=4"
      - name: Render the full S5-R printable part set
        run: |
          python 08-current-design/fabrication/tools/render_fab_parts.py
      - name: Regenerate the print + assembly manifests
        run: |
          python 08-current-design/fabrication/tools/gen_manifests.py
      - name: Fabrication-package coherence gate (C1-C7)
        run: |
          python 08-current-design/fabrication/tools/fab_package_checks.py
      - name: S5-R full part-set printability (sourced FDM limits)
        run: |
          python tools/validate/analytic_printability.py \
            --json s5r-parts-printability-record.json \
            --fail-on-design-fail \
            08-current-design/fabrication/scad/s5r_parts.scad
      - name: Install PNG render dependency (DND-69)
        run: python -m pip install --quiet "numpy>=1.26" "pillow>=10"
      - name: Regenerate + verify the board-viewable PNG renders (DND-69)
        # Rasterizes the committed OpenSCAD STLs with a software renderer (the
        # runner's OpenSCAD PNG backend needs a GL context; these renders do
        # not). Regenerates into images/, then verifies every recorded image is
        # present and a valid PNG. CAD render, not a print.
        run: |
          python 08-current-design/fabrication/tools/render_images.py
          python 08-current-design/fabrication/tools/render_images.py --check
      - name: Upload fabrication-package records
        uses: actions/upload-artifact@v4
        with:
          name: fabrication-package-records
          path: |
            08-current-design/fabrication/manifests/*.json
            08-current-design/fabrication/manifests/*.csv
            08-current-design/fabrication/manifests/*.md
            08-current-design/fabrication/images/*.png
            s5r-parts-printability-record.json
          if-no-files-found: warn

  geometry-validation-harness:
    # The software-only replacement for a print test (DND-29): real OpenSCAD
    # render -> mesh validation -> sourced analytic printability gate.
    # A missing OpenSCAD here fails the job (--require-openscad) so the render
    # step can never silently skip in the job whose purpose is the render.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Run the geometry validation harness
        run: |
          python tools/validate/validate_geometry.py \
            --require-openscad --json harness-record.json
      - name: Printability table (standalone, sourced limits)
        # A printability FAIL is a DESIGN finding, not a tool error, so this
        # step exits 0 and the table is kept as evidence. Only a tool error
        # (exit 2) fails the step. Gate on a design FAIL explicitly with
        # --fail-on-design-fail if a downstream stage needs that.
        run: |
          python tools/validate/analytic_printability.py \
            --json printability-record.json \
            06-experiments/test11_shared_drive_gate_analysis/selector_fanout_coupon.scad
      - name: Upload harness records
        uses: actions/upload-artifact@v4
        with:
          name: geometry-validation-record
          path: |
            harness-record.json
            printability-record.json
          if-no-files-found: warn

