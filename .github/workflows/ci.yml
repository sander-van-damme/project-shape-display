name: engineering-checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engineering-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test08 deterministic engineering checks
        run: python 06-experiments/test08_architecture_search/checks.py
      - name: Test09 validation workflow
        run: python 06-experiments/test09_test08_validation/run.py
      - name: Test10 architecture scale bounds
        run: python 06-experiments/test10_broad_architecture_screen/checks.py
      - name: Test11 shared-drive rejection gates
        run: |
          python 06-experiments/test11_shared_drive_gate_analysis/checks.py
          python 06-experiments/test11_shared_drive_gate_analysis/coupon_geometry.py
          python 06-experiments/test11_shared_drive_gate_analysis/make_coupon_stl.py
          python 06-experiments/test11_shared_drive_gate_analysis/verify_coupon_stl.py
      - name: T11-A fit-coupon gate engine (synthetic self-test + schema + prediction)
        run: |
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --selftest
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --validate
          python 06-experiments/test11_shared_drive_gate_analysis/t11a_fit_check.py --predict
