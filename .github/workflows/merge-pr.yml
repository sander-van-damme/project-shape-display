name: merge-pr

# Reusable open-PR merger. Requires no PAT: uses the workflow-scoped
# GITHUB_TOKEN with contents:write + pull-requests:write. Agents push a branch
# with the shared deploy key; this workflow merges the open PR for that branch
# (squash, keeping the branch) once it is present.
#
# Policy: board directive DND-19 delegates PR-merge authority to agents once the
# change is reviewed and checks/evidence support it. This workflow is the
# no-PAT mechanism equivalent to `open-pr.yml`.
#
# Safety: this is MANUAL-ONLY (workflow_dispatch). It never fires on push, so an
# unreviewed branch push cannot auto-merge itself. A caller must name the branch
# to merge, by which point the PR and its checks have been reviewed. GitHub
# itself refuses the merge endpoint when required checks are failing.

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch whose open PR should be merged"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Merge the open PR for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.inputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          PRS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${REPO}/pulls?head=${OWNER}:${BRANCH}&state=open")
          NUM=$(echo "$PRS" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d[0]["number"] if d else "")')
          if [ -z "$NUM" ]; then
            echo "No open PR for ${BRANCH}; nothing to merge."
            exit 0
          fi
          echo "Merging PR #${NUM} for ${BRANCH}"
          RESP=$(curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${NUM}/merge" \
            -d '{"merge_method":"squash"}')
          echo "$RESP" | python3 -c \
            'import sys,json;d=json.load(sys.stdin);print("merged:", d.get("merged"), "|", d.get("message"))'
