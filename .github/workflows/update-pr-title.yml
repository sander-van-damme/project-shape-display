name: update-pr-title

# One-shot: set the human-readable PR title for this branch using the
# workflow-scoped GITHUB_TOKEN. Safe to leave in place; it is idempotent.

"on":
  push:
    branches:
      - cost/dnd6-bom-sourcing-printability
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  set-title:
    runs-on: ubuntu-latest
    steps:
      - name: Set PR #12 title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" != "cost/dnd6-bom-sourcing-printability" ]; then
            echo "Not the target branch; nothing to do."; exit 0
          fi
          TITLE="Add Test11 cost, printability and reliability analysis for S1-S5"
          PAYLOAD=$(TITLE="$TITLE" python3 -c 'import json,os;print(json.dumps({"title":os.environ["TITLE"]}))')
          curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/12" -d "$PAYLOAD" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print("PR title now:", d.get("title") or d)'
