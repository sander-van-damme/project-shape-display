name: open-pr

# Reusable, credential-free branch -> PR opener.
#
# Agents push feature branches with the repo-scoped SSH deploy key, then this
# workflow opens (or updates) the pull request using the automatic
# `GITHUB_TOKEN` (permission: pull-requests: write). No board-provisioned PAT is
# required. The mechanism was proven live on the DND-15 capability probe.
#
# Three ways to use it:
#
# 1. Automatic: it runs on any push to a non-main branch and opens a PR if one
#    is not already open. The PR body is read from `.github/open-pr-body.md`
#    on the branch when present; otherwise a generated default is used.
#
# 2. Manual: Actions -> "open-pr" -> Run workflow, then set `head`, `base`,
#    `title`, `body` or `body_file`.
#
# 3. Called from another workflow:
#      jobs:
#        open:
#          uses: ./.github/workflows/open-pr.yml
#          with:
#            head: my/topic
#            base: main
#            body_file: docs/my-pr-body.md
#          secrets: inherit
#
# It is idempotent: if an open PR already exists for head -> base, the title and
# body are updated instead of creating a duplicate.

"on":
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      head:
        description: "Head branch (default: the branch this run is on)"
        required: false
        type: string
      base:
        description: "Base branch"
        required: false
        default: main
        type: string
      title:
        description: "PR title (default: last commit subject)"
        required: false
        type: string
      body:
        description: "PR body text (ignored if body_file is set)"
        required: false
        type: string
      body_file:
        description: "Repo-relative markdown file to use as the PR body"
        required: false
        type: string
      draft:
        description: "Open as draft"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      head:
        required: false
        type: string
      base:
        required: false
        default: main
        type: string
      title:
        required: false
        type: string
      body:
        required: false
        type: string
      body_file:
        required: false
        type: string
      draft:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.ref_name }}
          fetch-depth: 0

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_HEAD: ${{ github.ref_name }}
          HEAD_INPUT: ${{ inputs.head }}
          BASE_INPUT: ${{ inputs.base }}
          TITLE_INPUT: ${{ inputs.title }}
          BODY_INPUT: ${{ inputs.body }}
          BODY_FILE_INPUT: ${{ inputs.body_file }}
          DRAFT_INPUT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.error, urllib.request

          repo = os.environ["REPO"]
          owner = repo.split("/")[0]
          head = (os.environ.get("HEAD_INPUT") or os.environ.get("DEFAULT_HEAD") or "").strip()
          base = (os.environ.get("BASE_INPUT") or "main").strip()
          draft = str(os.environ.get("DRAFT_INPUT", "false")).lower() == "true"
          if not head or head == base:
              raise SystemExit(f"refusing: head={head!r} base={base!r}")

          title = (os.environ.get("TITLE_INPUT") or "").strip()
          if not title:
              title = subprocess.run(
                  ["git", "log", "-1", "--pretty=%s"], capture_output=True, text=True
              ).stdout.strip() or f"[{head}] automated PR"

          body = os.environ.get("BODY_INPUT") or ""
          body_file = (os.environ.get("BODY_FILE_INPUT") or "").strip()
          if body_file and os.path.isfile(body_file):
              body = open(body_file, encoding="utf-8").read()
          elif not body:
              body = f"Automated PR opened by the `open-pr` workflow for branch `{head}`."

          api = f"https://api.github.com/repos/{repo}"
          hdrs = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "shape-display-lab-open-pr",
          }

          def call(method, url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=hdrs, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"null")

          status, prs = call("GET", f"{api}/pulls?state=open&head={owner}:{head}&base={base}")
          if status != 200:
              raise SystemExit(f"list PRs failed HTTP {status}: {prs}")

          if prs:
              num = prs[0]["number"]
              status, pr = call("PATCH", f"{api}/pulls/{num}", {"title": title, "body": body})
              if status != 200:
                  raise SystemExit(f"update PR #{num} failed HTTP {status}: {pr}")
              print(f"updated PR #{num}: {pr['html_url']}")
          else:
              status, pr = call("POST", f"{api}/pulls", {
                  "title": title, "head": head, "base": base, "body": body, "draft": draft,
              })
              if status != 201:
                  raise SystemExit(f"create PR failed HTTP {status}: {pr}")
              print(f"opened PR #{pr['number']}: {pr['html_url']}")
          PY

      - name: Summary
        if: always()
        run: echo "PR open/updated for \`${{ inputs.head || github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
