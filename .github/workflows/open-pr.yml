name: open-pr

# Reusable branch -> PR opener. Requires no PAT: uses the workflow-scoped
# GITHUB_TOKEN with pull-requests: write. Agents push a branch with the shared
# deploy key; this workflow opens the PR against main.
#
# The PR body is read from .github/open-pr-body.md on the branch when present.

"on":
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXISTING=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${REPO}/pulls?head=${REPO%%/*}:${BRANCH}&state=open")
          COUNT=$(echo "$EXISTING" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')
          if [ "$COUNT" != "0" ]; then
            echo "PR already open for ${BRANCH}; nothing to do."
            exit 0
          fi
          TITLE=$(git log -1 --pretty=%s 2>/dev/null || echo "Automated PR for ${BRANCH}")
          if [ -f .github/open-pr-body.md ]; then
            BODY=$(cat .github/open-pr-body.md)
          else
            BODY="Automated PR opened by the open-pr workflow for branch \`${BRANCH}\`."
          fi
          PAYLOAD=$(TITLE="$TITLE" BRANCH="$BRANCH" BODY="$BODY" python3 -c \
            'import json,os;print(json.dumps({"title":os.environ["TITLE"],"head":os.environ["BRANCH"],"base":"main","body":os.environ["BODY"]}))')
          RESP=$(curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls" -d "$PAYLOAD")
          echo "$RESP" | python3 -c \
            'import sys,json;d=json.load(sys.stdin);print("PR:", d.get("html_url") or d)'
