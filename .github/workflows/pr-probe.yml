name: pr-capability-probe

"on":
  push:
    branches:
      - probe/gh-actions-pr-capability

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report token identity
        run: |
          echo "token actor: ${{ github.actor }}"
          curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }} | head -c 400
          echo
      - name: Attempt PR creation via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          RESP=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d '{"title":"[probe] actions-token PR capability","head":"probe/gh-actions-pr-capability","base":"main","body":"Automated probe: can the workflow GITHUB_TOKEN open a PR? This branch is disposable."}')
          echo "$RESP"
